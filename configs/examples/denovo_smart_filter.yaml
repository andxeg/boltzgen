# De Novo Nanobody Design - PRODUCTION
# Pure de novo mode: BoltzGen generates single-chain nanobody (VHH) from scratch
# Full-scale run with proper budget
# Protocol: nanobody-anything (single-chain binders)

project:
  name: "CXCR4_denovo_nanobody_production"
  type: "de_novo"

targets:
  positive:
    - name: "CXCR4"
      pdb: "data/cxcr4/8u4q_cxcr4.pdb"
      chain: "R"
  negative:
    - name: "CCR5"
      pdb: "data/cxcr4/4mbs_ccr5.pdb"
      chain: "A"
    - name: "CXCR2"
      pdb: "data/cxcr4/6lfo_cxcr2.pdb"
      chain: "A"

# NO SCAFFOLD - pure de novo design!
# BoltzGen will generate single-chain nanobody (VHH) from scratch
# Output: 1-chain binder (not 2-chain Fab)

parameters:
  num_designs: 100               # Generate 100 designs
  num_candidates: 15             # Keep top 15 in final output
  # num_offtarget_predictions: NOT SET (defaults to num_candidates)
  budget: 100                    # High budget for production quality

  # Performance note:
  # Only top 15 (by primary affinity) scored against off-targets
  # 15 candidates × 2 off-targets = 30 predictions
  #
  # Expected runtime: ~2-3 hours (depending on GPU)

scoring:
  multi_objective: true
  weights:
    affinity: 0.6
    selectivity: 0.3
    properties: 0.1

output:
  directory: "results/cxcr4_denovo_nanobody_production"
  format: ["csv", "json", "plots"]
