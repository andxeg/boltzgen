# Smart Pre-filtering (Recommended, Default)
# Score only top candidates against off-targets for efficiency

project:
  name: "CXCR4_smart_filter"
  type: "existing_binder"

targets:
  positive:
    - name: "CXCR4"
      pdb: "data/cxcr4/8u4q_cxcr4.pdb"
      chain: "R"
  negative:
    - name: "CCR5"
      pdb: "data/cxcr4/4mbs_ccr5.pdb"
      chain: "A"
    - name: "CXCR2"
      pdb: "data/cxcr4/6lfo_cxcr2.pdb"
      chain: "A"

scaffold:
  pdb: "data/cxcr4/8u4q_fab.pdb"
  chains: ["H", "L"]
  design_regions:
    - chain: "H"
      residues: "26-35,50-65,95-102"
    - chain: "L"
      residues: "24-34,50-56,89-97"

parameters:
  num_designs: 100               # Generate many designs
  num_candidates: 10             # Keep top 10 in final output
  # num_offtarget_predictions: NOT SET (defaults to num_candidates)
  budget: 50

  # Performance note:
  # Only top 10 (by primary affinity) scored against off-targets
  # 10 candidates × 2 off-targets = 20 predictions
  #
  # Rationale: Designs with poor primary binding won't be selected
  # anyway, so we skip expensive off-target predictions for them

scoring:
  multi_objective: true
  weights:
    affinity: 0.6
    selectivity: 0.3
    properties: 0.1

output:
  directory: "results/cxcr4_smart_filter"
  format: ["csv", "json", "plots"]
