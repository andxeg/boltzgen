# Score ALL Designs (Exhaustive)
# Use this when you want selectivity scores for every design

project:
  name: "CXCR4_score_all"
  type: "existing_binder"

targets:
  positive:
    - name: "CXCR4"
      pdb: "data/cxcr4/8u4q_cxcr4.pdb"
      chain: "R"
  negative:
    - name: "CCR5"
      pdb: "data/cxcr4/4mbs_ccr5.pdb"
      chain: "A"
    - name: "CXCR2"
      pdb: "data/cxcr4/6lfo_cxcr2.pdb"
      chain: "A"

scaffold:
  pdb: "data/cxcr4/8u4q_fab.pdb"
  chains: ["H", "L"]
  design_regions:
    - chain: "H"
      residues: "26-35,50-65,95-102"
    - chain: "L"
      residues: "24-34,50-56,89-97"

parameters:
  num_designs: 20
  num_candidates: 5                # Final output will have top 5
  num_offtarget_predictions: "all" # Score ALL 20 designs against off-targets
  budget: 20

  # Performance note:
  # 20 designs × 2 off-targets = 40 predictions

scoring:
  multi_objective: true
  weights:
    affinity: 0.6
    selectivity: 0.3
    properties: 0.1

output:
  directory: "results/cxcr4_score_all"
  format: ["csv", "json", "plots"]
