# Custom Configuration
# Score a specific number of top candidates

project:
  name: "CXCR4_custom"
  type: "existing_binder"

targets:
  positive:
    - name: "CXCR4"
      pdb: "data/cxcr4/8u4q_cxcr4.pdb"
      chain: "R"
  negative:
    - name: "CCR5"
      pdb: "data/cxcr4/4mbs_ccr5.pdb"
      chain: "A"
    - name: "CXCR2"
      pdb: "data/cxcr4/6lfo_cxcr2.pdb"
      chain: "A"

scaffold:
  pdb: "data/cxcr4/8u4q_fab.pdb"
  chains: ["H", "L"]
  design_regions:
    - chain: "H"
      residues: "26-35,50-65,95-102"
    - chain: "L"
      residues: "24-34,50-56,89-97"

parameters:
  num_designs: 50                      # Generate 50 designs
  num_candidates: 15                   # Keep top 15 in final output
  num_offtarget_predictions: 20        # Score top 20 against off-targets
  budget: 30

  # Configuration explanation:
  # 1. Generate 50 designs (cast wide net)
  # 2. Score top 20 against off-targets (reasonable compute)
  # 3. Keep top 15 in final results (focused selection)
  #
  # Performance: 20 × 2 = 40 predictions

scoring:
  multi_objective: true
  weights:
    affinity: 0.6
    selectivity: 0.3
    properties: 0.1

output:
  directory: "results/cxcr4_custom"
  format: ["csv", "json", "plots"]
