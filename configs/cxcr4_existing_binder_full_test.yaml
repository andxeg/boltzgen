# CXCR4 Existing Binder Optimization - Full Pipeline Test
# Real end-to-end test: BoltzGen → Selectivity → Pareto → JSON
# Target: 100 designs with 20 candidates for selectivity scoring

project:
  name: "CXCR4_existing_binder_full_test"
  type: "existing_binder"

targets:
  positive:
    - name: "CXCR4"
      pdb: "data/cxcr4/8u4q_cxcr4.pdb"
      chain: "R"
  negative:
    - name: "CCR5"
      pdb: "data/cxcr4/4mbs_ccr5.pdb"
      chain: "A"
    - name: "CXCR2"
      pdb: "data/cxcr4/6lfo_cxcr2.pdb"
      chain: "A"

scaffold:
  pdb: "data/cxcr4/8u4q_fab.pdb"
  chains: ["H", "L"]
  design_regions:
    - chain: "H"
      residues: "26-35,50-65,95-102"
    - chain: "L"
      residues: "24-34,50-56,89-97"

parameters:
  num_designs: 100         # Total designs to generate
  num_candidates: 20       # Keep top 20 in final output
  budget: 50               # BoltzGen sampling budget

  # Performance note:
  # Only top 20 (by primary affinity) scored against off-targets
  # 20 candidates × 2 off-targets = 40 predictions

scoring:
  weights:
    affinity: 0.6         # Primary target binding weight
    selectivity: 0.3      # Off-target avoidance weight
    properties: 0.1       # Biophysical properties weight
  multi_objective: true   # Enable Pareto ranking

output:
  directory: "results/cxcr4_existing_binder_full_test"
  format: ["csv", "json", "plots"]
